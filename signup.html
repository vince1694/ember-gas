<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — EmberGas Marketplace</title>
  <meta name="description" content="Sign up for an EmberGas account to order cooking gas, track live delivery, or register as a LPG vendor.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #00B14F;
      --green-dark: #008F3E;
      --green-light: #E6F7ED;
      --orange: #F97316;
      --bg: #F0F4F8;
      --card: #FFFFFF;
      --text: #111827;
      --muted: #6B7280;
      --border: #E5E7EB;
      --radius: 18px;
      --shadow: 0 8px 32px rgba(0,0,0,0.10);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: radial-gradient(circle at 20% 20%, rgba(0,177,79,0.08) 0%, transparent 60%),
                        radial-gradient(circle at 80% 80%, rgba(249,115,22,0.06) 0%, transparent 60%);
    }

    .page-wrap {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Logo ── */
    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
    }
    .logo-flame {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #00B14F, #00D863);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.4rem;
      box-shadow: 0 4px 16px rgba(0,177,79,0.3);
    }
    .logo-name { font-size: 1.6rem; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
    .logo-name span { color: var(--green); }

    /* ── Card ── */
    .auth-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px;
      border: 1px solid var(--border);
    }

    .card-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .card-header h1 { font-size: 1.6rem; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .card-header p { font-size: 0.9rem; color: var(--muted); }

    /* ── Role Selector ── */
    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }
    .role-btn {
      padding: 14px 10px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: #F9FAFB;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      font-family: 'Outfit', sans-serif;
    }
    .role-btn .rb-icon { font-size: 1.6rem; margin-bottom: 6px; display: block; }
    .role-btn .rb-label { font-size: 0.85rem; font-weight: 700; color: var(--muted); display: block; }
    .role-btn .rb-sub { font-size: 0.72rem; color: #9CA3AF; display: block; margin-top: 2px; }
    .role-btn.active {
      border-color: var(--green);
      background: var(--green-light);
    }
    .role-btn.active .rb-label { color: var(--green-dark); }

    /* ── Form Fields ── */
    .field-group { position: relative; margin-bottom: 16px; }
    .field-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .field-group input {
      width: 100%;
      padding: 13px 16px 13px 44px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      background: #FAFAFA;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field-group input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0,177,79,0.12);
      background: #fff;
    }
    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9CA3AF;
      font-size: 0.9rem;
      pointer-events: none;
    }
    .field-group label ~ .field-icon { top: calc(50% + 13px); }
    .pw-eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9CA3AF;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .field-group label ~ .pw-eye { top: calc(50% + 13px); }

    /* ── Submit Button ── */
    .btn-primary {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #00B14F, #00D863);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0,177,79,0.3);
      margin-top: 10px;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(0,177,79,0.4); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .divider { height: 1px; background: var(--border); margin: 20px 0; }
    .alt-action {
      text-align: center;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .alt-action a { color: var(--green); font-weight: 700; text-decoration: none; }

    /* ── Error Banner ── */
    .err-banner {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #991B1B;
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .err-banner.show { display: flex; }

    /* ── OTP Overlay Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: var(--radius);
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      position: relative;
      text-align: center;
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 32px; height: 32px;
      background: #F3F4F6; border: none; border-radius: 50%;
      font-size: 1.1rem; cursor: pointer; color: var(--muted);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-icon { font-size: 2.2rem; margin-bottom: 8px; }
    .modal-title { font-size: 1.25rem; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .modal-sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 18px; }

    .otp-code-display {
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin: 14px 0;
      display: none;
    }
    .otp-code-display .otp-num {
      font-size: 2rem;
      font-weight: 800;
      color: var(--green);
      letter-spacing: 8px;
    }
    .otp-code-display p { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

    .otp-inputs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .otp-box {
      width: 46px; height: 54px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    .otp-box:focus { border-color: var(--green); }

    /* ── Toast ── */
    .toast-wrap {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: #1F2937;
      color: #fff;
      padding: 12px 20px;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex; align-items: center; gap: 8px;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(16px);
      transition: all 0.3s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success i { color: #34D399; }
    .toast.error i { color: #F87171; }

    .footer-links { text-align: center; font-size: 0.8rem; color: var(--muted); }
    .footer-links a { color: var(--green); text-decoration: none; }

    @media (max-width: 480px) {
      .auth-card { padding: 24px 18px; }
      .otp-box { width: 38px; height: 46px; font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<div class="toast-wrap" id="toastWrap"></div>

<div class="page-wrap">
  <!-- Logo -->
  <div class="logo-row">
    <div class="logo-flame"><i class="fa-solid fa-fire-flame-curved"></i></div>
    <div class="logo-name">Ember<span>Gas</span></div>
  </div>

  <!-- Signup Card -->
  <div class="auth-card">
    <div class="card-header">
      <h1>Create Account 🚀</h1>
      <p>Join EmberGas as a Customer or Gas Vendor</p>
    </div>

    <!-- Account Role Grid -->
    <div class="role-grid">
      <button class="role-btn active" id="roleCustomer" onclick="selectRole('customer')">
        <span class="rb-icon">🛒</span>
        <span class="rb-label">Customer</span>
        <span class="rb-sub">Order cooking gas</span>
      </button>
      <button class="role-btn" id="roleVendor" onclick="selectRole('vendor')">
        <span class="rb-icon">⛽</span>
        <span class="rb-label">Gas Vendor</span>
        <span class="rb-sub">Sell & manage stock</span>
      </button>
    </div>

    <!-- Error Banner -->
    <div class="err-banner" id="errBanner">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="errMsg">Error message</span>
    </div>

    <!-- Form -->
    <form id="signupForm" onsubmit="initiateSignup(event)" novalidate>
      <div class="field-group">
        <label for="fullname">Full Name <span id="nameExtraLabel"></span></label>
        <i class="fa-solid fa-user field-icon"></i>
        <input type="text" id="fullname" placeholder="e.g., John Doe" required>
      </div>

      <div class="field-group" id="bizNameGroup" style="display:none;">
        <label for="businessName">Gas Station / Business Name</label>
        <i class="fa-solid fa-store field-icon"></i>
        <input type="text" id="businessName" placeholder="e.g., Ember Gas Depot Ikeja">
      </div>

      <div class="field-group">
        <label for="email">Email Address</label>
        <i class="fa-solid fa-envelope field-icon"></i>
        <input type="email" id="email" placeholder="yourname@email.com" autocomplete="email" required>
      </div>

      <div class="field-group">
        <label for="phone">Phone Number</label>
        <i class="fa-solid fa-phone field-icon"></i>
        <input type="tel" id="phone" placeholder="08012345678" required>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <i class="fa-solid fa-lock field-icon"></i>
        <input type="password" id="password" placeholder="Minimum 6 characters" autocomplete="new-password" required>
        <i class="fa-solid fa-eye pw-eye" id="pwEye" onclick="togglePw('password','pwEye')"></i>
      </div>

      <button type="submit" class="btn-primary" id="signupBtn">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Continue & Send OTP</span>
      </button>
    </form>

    <div class="divider"></div>

    <div class="alt-action">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </div>

  <div class="footer-links">
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Homepage</a>
  </div>
</div>

<!-- OTP Modal -->
<div class="modal-overlay" id="otpModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeOtpModal()">&times;</button>
    <div class="modal-icon">📧</div>
    <div class="modal-title">Verify Email OTP</div>
    <div class="modal-sub">We sent a 6-digit verification code to <br><strong id="otpEmailTarget" style="color:var(--text)">email@example.com</strong></div>

    <div class="otp-code-display" id="otpDisplay">
      <div class="otp-num" id="otpDisplayNum"></div>
      <p>Auto-filled verification code</p>
    </div>

    <div class="otp-inputs">
      <input type="text" class="otp-box" id="otp1" maxlength="1" oninput="focusNext(this, 'otp2')">
      <input type="text" class="otp-box" id="otp2" maxlength="1" oninput="focusNext(this, 'otp3')">
      <input type="text" class="otp-box" id="otp3" maxlength="1" oninput="focusNext(this, 'otp4')">
      <input type="text" class="otp-box" id="otp4" maxlength="1" oninput="focusNext(this, 'otp5')">
      <input type="text" class="otp-box" id="otp5" maxlength="1" oninput="focusNext(this, 'otp6')">
      <input type="text" class="otp-box" id="otp6" maxlength="1">
    </div>

    <button class="btn-primary" id="verifyBtn" onclick="verifyAndRegister()">
      <i class="fa-solid fa-check-circle"></i>
      <span>Verify & Create Account</span>
    </button>
  </div>
</div>

<script src="app.js"></script>
<script>
  let selectedRole = 'customer';
  let pendingUserData = null;

  // API helper (production relative, local fallback)
  async function api(path, opts = {}) {
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    if (!isLocal) {
      return await fetch(path, opts);
    }
    const hosts = ['', 'http://127.0.0.1:5000', 'http://localhost:5000'];
    let lastErr;
    for (const h of hosts) {
      try {
        const res = await fetch(h ? h + path : path, opts);
        if (res.status !== 404 || (await res.headers.get('content-type') || '').includes('application/json')) {
          return res;
        }
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('Cannot reach server');
  }

  function toast(msg, type = 'success') {
    const wrap = document.getElementById('toastWrap');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i><span>${msg}</span>`;
    wrap.appendChild(el);
    setTimeout(() => el.classList.add('show'), 10);
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 4000);
  }

  function showErr(msg) {
    const b = document.getElementById('errBanner');
    document.getElementById('errMsg').textContent = msg;
    b.classList.add('show');
    setTimeout(() => b.classList.remove('show'), 6000);
  }
  function hideErr() { document.getElementById('errBanner').classList.remove('show'); }

  function selectRole(r) {
    selectedRole = r;
    document.getElementById('roleCustomer').classList.toggle('active', r === 'customer');
    document.getElementById('roleVendor').classList.toggle('active', r === 'vendor');
    document.getElementById('bizNameGroup').style.display = r === 'vendor' ? 'block' : 'none';
    hideErr();
  }

  function togglePw(inputId, iconId) {
    const inp = document.getElementById(inputId);
    const ico = document.getElementById(iconId);
    if (inp.type === 'password') { inp.type = 'text'; ico.classList.replace('fa-eye','fa-eye-slash'); }
    else { inp.type = 'password'; ico.classList.replace('fa-eye-slash','fa-eye'); }
  }

  function focusNext(curr, nextId) {
    if (curr.value.length >= 1) {
      document.getElementById(nextId).focus();
    }
  }

  async function initiateSignup(e) {
    e.preventDefault();
    hideErr();

    const name = document.getElementById('fullname').value.trim();
    const businessName = document.getElementById('businessName').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;

    if (!name || !email || !phone || !password) {
      showErr('Please fill in all required fields.');
      return;
    }

    if (password.length < 6) {
      showErr('Password must be at least 6 characters.');
      return;
    }

    pendingUserData = { name, businessName, email, phone, password, role: selectedRole };

    const btn = document.getElementById('signupBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Sending OTP...</span>';

    try {
      const res = await api('/api/auth/send-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, name, phone })
      });
      const data = await res.json();

      if (!res.ok) {
        showErr(data.message || 'Failed to send verification OTP.');
        return;
      }

      document.getElementById('otpEmailTarget').textContent = email;
      
      // Auto-fill OTP boxes if returned
      if (data.otpCode) {
        for (let i = 1; i <= 6; i++) {
          const box = document.getElementById(`otp${i}`);
          if (box && data.otpCode[i - 1]) box.value = data.otpCode[i - 1];
        }
        document.getElementById('otpDisplayNum').textContent = data.otpCode;
        document.getElementById('otpDisplay').style.display = 'block';
      } else {
        document.getElementById('otpDisplay').style.display = 'none';
      }

      document.getElementById('otpModal').classList.add('show');
      toast('Verification code generated!', 'success');

    } catch (err) {
      showErr('Cannot connect to server. Check your internet.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i><span>Continue & Send OTP</span>';
    }
  }

  function closeOtpModal() {
    document.getElementById('otpModal').classList.remove('show');
  }

  async function verifyAndRegister() {
    if (!pendingUserData) return;

    let code = '';
    for (let i = 1; i <= 6; i++) {
      code += (document.getElementById(`otp${i}`).value || '').trim();
    }

    if (code.length < 6) {
      toast('Please enter the 6-digit OTP code.', 'error');
      return;
    }

    const btn = document.getElementById('verifyBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Creating Account...</span>';

    try {
      // Create user account in MongoDB Atlas
      const regRes = await api('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(pendingUserData)
      });
      const regData = await regRes.json();

      if (!regRes.ok) {
        toast(regData.message || 'Registration failed.', 'error');
        closeOtpModal();
        showErr(regData.message || 'Registration failed.');
        return;
      }

      // Save user & auto-login
      const user = {
        _id: regData._id,
        name: regData.name,
        email: regData.email,
        phone: regData.phone,
        role: regData.role,
        businessName: regData.businessName || '',
        token: regData.token,
        loginTime: new Date().toISOString()
      };
      localStorage.setItem('currentUser', JSON.stringify(user));

      toast('Account created successfully! 🎉', 'success');
      closeOtpModal();

      setTimeout(() => {
        if (user.role === 'vendor' || user.role === 'seller') {
          window.location.href = 'seller_dashboard.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      }, 800);

    } catch (err) {
      toast('Network error during registration.', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-check-circle"></i><span>Verify & Create Account</span>';
    }
  }

  // Pre-select role if URL specifies
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const roleParam = params.get('role');
    if (roleParam === 'vendor') selectRole('vendor');
  });
</script>
</body>
</html>
